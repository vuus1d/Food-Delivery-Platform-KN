<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Delivery KN Astana</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page-container">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            🛒 <span>Delivery KN Astana</span>
        </div>

        <nav>
            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="stores.html">Stores</a>
                </li>

                <li>
                    <a href="compare.html">Price Comparison</a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart
                        <span id="cart-count" class="cart-count">0</span>
                    </a>
                </li>

            </ul>
        </nav>

    </header>


    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h3>Information</h3>

        <ul class="category-list">

            <li>
                <a href="stores.html">
                    🚚 Express Delivery
                </a>
            </li>

            <li>
                <a href="cart.html">
                    💳 Kaspi / Card Payment
                </a>
            </li>

            <li>
                <a href="index.html">
                    🛡️ Freshness Guarantee
                </a>
            </li>

        </ul>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

        <section class="comparison-section">

            <div class="section-heading">

                <h2>Your Cart</h2>

                <button
                        id="clear-cart"
                        class="btn danger-btn"
                >
                    Clear Cart
                </button>

            </div>


            <!-- CART ITEMS -->
            <div
                    id="cart-items"
                    class="cart-list"
            ></div>


            <!-- CART SUMMARY -->
            <div class="cart-summary">

                <h3>
                    Total:
                    <span id="cart-total">0 ₸</span>
                </h3>

                <button
                        id="checkout-btn"
                        class="btn checkout-btn"
                >
                    Checkout
                </button>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            &copy; 2026 Food Delivery Platform KN (Astana).
            All rights reserved.
        </p>

    </footer>

</div>

<script src="js/app.js"></script>

</body>
</html>
