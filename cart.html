<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodly — Checkout Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="main-header">
    <div class="container header-container">
        <a href="index.html" class="logo">Foodly</a>
        <nav class="nav-menu">
            <a href="index.html">Главная</a>
            <a href="stores.html">Магазины</a>
            <a href="compare.html">Сравнить цены</a>
            <a href="cart.html" class="active">Корзина <span id="cart-count">0</span></a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="page-header">
        <h1>Оформление заказа</h1>
    </section>

    <section class="form-section">
        <form id="contact-form" action="#" method="post">

            <label for="user-name">Имя пользователя:</label>
            <input type="text" id="user-name" name="name" placeholder="Введите ваше имя" required>

            <label for="user-email">Email адрес:</label>
            <input type="email" id="user-email" name="email" placeholder="example@mail.com" required>

            <label for="payment-method">Способ оплаты:</label>
            <select id="payment-method" name="payment">
                <option value="kaspi">Kaspi Pay</option>
                <option value="freedom">Freedom Bank</option>
                <option value="cash">Наличными курьеру</option>
            </select>

            <label for="fav-color">Выберите цвет упаковки:</label>
            <input type="color" id="fav-color" name="color" value="#2e7d32">

            <label for="user-message">Комментарий к доставке:</label>
            <textarea id="user-message" name="message" rows="4" placeholder="Укажите код подъезда, этаж..."></textarea>

            <button type="submit" class="btn">Отправить заказ</button>
        </form>
    </section>
</main>

<footer>
    <div class="container">
        <p>© 2026 Foodly | Разработчики: Kakhar Nassyrkhan, Nurasyl Raiskaliev (Group SE-2506)</p>
    </div>
</footer>

</body>
</html>
